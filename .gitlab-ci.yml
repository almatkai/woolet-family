image: docker:latest

services:
  - docker:dind

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_REGISTRY: $CI_REGISTRY
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE

stages:
  - build
  - deploy

build_image:
  stage: build
  only:
    - master
  script:
    - docker login -u "$CONTAINER_REGISTRY_USER" -p "$CONTAINER_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - >
      docker build
      -t "$DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA"
      -f apps/web/Dockerfile
      --build-arg VITE_CLERK_PUBLISHABLE_KEY="$VITE_CLERK_PUBLISHABLE_KEY"
      --build-arg VITE_API_URL="$VITE_API_URL"
      --build-arg VITE_PUBLIC_POSTHOG_KEY="$VITE_PUBLIC_POSTHOG_KEY"
      --build-arg VITE_PUBLIC_POSTHOG_HOST="$VITE_PUBLIC_POSTHOG_HOST"
      --build-arg VITE_GLITCHTIP_DSN_WEB="$VITE_GLITCHTIP_DSN_WEB"
      .
    - docker push "$DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA"

deploy:
  image: alpine
  stage: deploy
  only:
    - master
  needs:
    - build_image
  script:
    - apk add --no-cache curl
    - |
      echo "Triggering external pipeline root/deploy..."

      curl -X POST \
        --fail \
        -F "token=$ROOT_DEPLOY_TRIGGER_TOKEN" \
        -F "ref=master" \
        -F "variables[DEPLOYMENT_TAG]=$CI_COMMIT_SHORT_SHA" \
        -F "variables[DEPLOYMENT_NAME]=$CI_PROJECT_PATH" \
        -F "variables[DEPLOYMENT_LOGS_USER]=$CONTAINER_REGISTRY_USER" \
        -F "variables[DEPLOYMENT_LOGS_PASSWORD]=$CONTAINER_REGISTRY_PASSWORD" \
        "https://$CI_SERVER_HOST/api/v4/projects/$ROOT_DEPLOY_TRIGGER_PROJECT/trigger/pipeline"
